name: Layered map checks and Pages
on:
  push:
    branches: [main, map/layered-village-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: layered-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node tools/verify-archive.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8765 --directory dist > /tmp/map-server.log 2>&1 &
          node tools/map-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layered-map-browser-checks
          path: test-results/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish current map only
        id: deployment
        uses: actions/deploy-pages@v4
