name: Verify Hizuki 8-direction free-movement preview

on:
  push:
    branches: [main]
    paths:
      - 'experiments/hizuki-8direction-preview/**'
      - '.github/workflows/hizuki-8direction-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers-and-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Validate directions and free continuous movement
        run: |
          python3 -m http.server 8765 --directory . > /tmp/hizuki-preview-http.log 2>&1 &
          mkdir -p /tmp/hizuki-preview-qa
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium,webkit} from 'playwright';
          import fs from 'node:fs';
          const url='http://127.0.0.1:8765/experiments/hizuki-8direction-preview/';
          for (const [engineName,engine] of [['chromium',chromium],['webkit',webkit]]) {
            const browser=await engine.launch({headless:true});
            try {
              for (const mobile of [false,true]) {
                const context=await browser.newContext({
                  viewport:mobile?{width:390,height:844}:{width:1280,height:850},
                  isMobile:mobile,hasTouch:mobile,deviceScaleFactor:mobile?3:1,
                });
                const page=await context.newPage();
                const pageErrors=[];
                page.on('pageerror', e=>pageErrors.push(String(e)));
                const response=await page.goto(url,{waitUntil:'load',timeout:30000});
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>document.querySelector('#status')?.textContent?.includes('素材OK'),{timeout:20000});
                assert.equal(await page.locator('#dirs button').count(),8);
                assert.match(await page.locator('p').first().textContent(),/マス目への吸着/);
                const image=await page.evaluate(()=>({width:sprites.naturalWidth,height:sprites.naturalHeight}));
                assert.deepEqual(image,{width:512,height:96});
                const pos=async()=>Number((await page.locator('#positionLabel').textContent()).match(/-?[0-9]+(?:\.[0-9]+)?/)[0]);
                const before=await pos();
                // Test user-visible D-pad via pointer; works in both Safari/WebKit and Chromium.
                // Use the real control, not synthetic key events which can be blocked by focus.
                const dpad=page.locator('#dpad button[data-dir="2"]');
                await dpad.scrollIntoViewIfNeeded();
                const box=await dpad.boundingBox();
                assert(box,'D-pad right button is visible');
                await page.mouse.move(box.x+box.width/2,box.y+box.height/2);
                await page.mouse.down();
                try {
                  await page.waitForFunction(() => {
                    const v=Number((document.querySelector('#positionLabel').textContent.match(/-?[0-9]+(?:\\.[0-9]+)?/))[0]);
                    return v>5;
                  },{timeout:4500});
                } catch (e) {
                  console.log('MOVEMENT DIAGNOSTICS',engineName,mobile,await page.evaluate(()=>({visibility:document.visibilityState,ready,px,py,last,frame,keys:[...keys],pointerDir})));
                  throw e;
                } finally {
                  await page.mouse.up();
                }
                const after=await pos();
                assert(after>before+5,'D-pad hold must cause continuous movement');
                assert(!Number.isInteger(after),'Position must support fractional pixels');
                assert.match(await page.locator('#directionLabel').textContent(),/右向き/);
                await page.locator('#grid').click();
                assert.equal(await page.locator('#grid').textContent(),'接地点表示：ON');
                await page.locator('#mode').selectOption('lineup');
                await page.locator('#dirs button[data-dir="7"]').click();
                assert.match(await page.locator('#directionLabel').textContent(),/左斜め前/);
                await page.screenshot({path:'/tmp/hizuki-preview-qa/'+engineName+'-'+(mobile?'mobile':'desktop')+'.png',fullPage:true});
                assert.deepEqual(pageErrors,[],'No browser runtime exceptions');
                console.log('PASS',engineName,mobile?'mobile':'desktop','world-x',before,'->',after);
                await context.close();
              }
            }finally{await browser.close();}
          }
          JS
      - name: Verify the public GitHub Pages copy
        run: |
          set -euo pipefail
          url=https://hihosir.github.io/kikokuno-hanachigiri/experiments/hizuki-8direction-preview/index.html
          ok=0
          for i in $(seq 1 30); do
            if curl --fail --location --silent --show-error --max-time 15 "$url?commit=$GITHUB_SHA" -o /tmp/hizuki-published.html &&
               grep -q '8方向自由移動プレビュー' /tmp/hizuki-published.html &&
               grep -q 'マス目への吸着・マス単位移動はありません' /tmp/hizuki-published.html &&
               grep -q 'data:image/png;base64,' /tmp/hizuki-published.html; then
               ok=1
               echo "Public Pages preview: HTTP 200 and expected game-free-movement contents verified"
               break
            fi
            echo "Waiting for Pages ($i/30)"
            sleep 8
          done
          test "$ok" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hizuki-free-movement-browser-qa
          path: /tmp/hizuki-preview-qa/
          if-no-files-found: ignore
