name: Field lab browser checks
on:
  push:
    paths: ['field-lab/**', 'tools/field-lab-smoke.mjs', '.github/workflows/field-lab.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8765 > /tmp/server.log 2>&1 &
          node tools/field-lab-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-lab-browser-screenshots
          path: test-results/
