<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26382f"><title>鬼哭の花契り — 淡彩マップ歩行試作</title><link rel="stylesheet" href="src/map/style.css"></head>
<body>
<main id="game"><canvas id="scene" aria-label="村の歩行マップ"></canvas>
 <header><div><span class="eyebrow">鬼哭の花契り · 歩行試作 01</span><h1 id="map-title">木漏れ日の村</h1></div><nav aria-label="表示"><button id="overview">全景</button><button id="inspect" aria-expanded="false">配置・検査</button></nav></header>
 <p id="hint">道をタップ、または左下のスティックで移動</p>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="loading" role="status"><span class="spinner"></span><p>村の風景を読み込んでいます</p><button id="retry" hidden>再読み込み</button></div>
 <div id="stick" role="group" aria-label="移動スティック"><span class="stick-cross"></span><span id="thumb"></span></div>
 <button id="action" aria-label="近くを調べる">調べる</button>
 <aside id="drawer" hidden aria-label="配置と検査">
  <div class="drawer-head"><h2>配置と歩行の検査</h2><button id="close-drawer" aria-label="閉じる">閉じる</button></div>
  <label class="check"><input id="debug" type="checkbox"> 歩行面・当たり判定・足元を表示</label>
  <label>景物<select id="object-select"></select></label>
  <div class="coordinates"><label>X（m）<input id="object-x" type="number" step="0.05"></label><label>Z（m）<input id="object-z" type="number" step="0.05"></label><button id="apply-position">配置を更新</button></div>
  <p class="small">配置を動かすと、足元・判定・橋の歩行面も一緒に動きます。変更はこの端末に保存されます。</p>
  <div class="buttons"><button id="export-map">マップJSONを保存</button><label class="file-button">JSONを読み込む<input id="import-map" type="file" accept="application/json,.json"></label></div>
  <div class="buttons"><button id="reset-map">初期配置に戻す</button><button id="reset-player">出発点へ</button></div>
  <details><summary>今回の制作範囲</summary><p class="small">独立した地面・家・木・橋で構成した屋外マップです。緋月は採用済みの立ち姿1枚を仮表示しています。方向別の歩行素材・室内・次のマップは準備中です。</p><p class="small">雲上ブラウザでの検査とiPhone Safari実機での検査は別に記録します。</p></details>
 </aside>
</main><script type="module" src="src/map/app.js"></script></body></html>
