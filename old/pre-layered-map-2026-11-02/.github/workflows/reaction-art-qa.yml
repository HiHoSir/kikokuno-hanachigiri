name: Reaction Art Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'field-lab/art/directional-actions/**'
      - 'field-lab/art/manifest.json'
      - 'scripts/verify-reaction-art.py'
      - '.github/workflows/reaction-art-qa.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection
        run: python -m pip install Pillow==11.3.0
      - name: Verify against real heroine files
        run: python scripts/verify-reaction-art.py
