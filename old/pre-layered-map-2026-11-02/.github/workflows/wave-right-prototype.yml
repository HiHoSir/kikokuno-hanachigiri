name: Right-facing wave artwork prototype
on:
  push:
    paths:
      - 'scripts/build-wave-right.py'
      - '.github/workflows/wave-right-prototype.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/build-wave-right.py
      - uses: actions/upload-artifact@v4
        with:
          name: wave-right-original-derived-v1
          path: field-lab/art/actions8/prototypes/
