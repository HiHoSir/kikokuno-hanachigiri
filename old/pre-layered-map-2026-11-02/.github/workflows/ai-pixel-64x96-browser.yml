name: AI pixel editor 64x96 8dir browser QA
on:
  pull_request:
    paths:
      - 'experiments/ai-pixel-editor-64x96/**'
      - 'tests/ai-pixel-editor-64x96.browser.mjs'
      - '.github/workflows/ai-pixel-64x96-browser.yml'
  push:
    branches:
      - improve/ai-pixel-editor-64x96-8dir
    paths:
      - 'experiments/ai-pixel-editor-64x96/**'
      - 'tests/ai-pixel-editor-64x96.browser.mjs'
      - '.github/workflows/ai-pixel-64x96-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify real browser behavior on mobile and desktop
        run: |
          python3 -m http.server 8765 >/tmp/kikoku-pixel-64-http.log 2>&1 &
          node tests/ai-pixel-editor-64x96.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kikoku-pixel-64-browser-screenshots
          path: /tmp/kikoku-pixel-64-qa/