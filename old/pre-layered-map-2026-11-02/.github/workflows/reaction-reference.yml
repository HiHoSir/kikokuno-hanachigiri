name: Build original reference comparison
on:
  push:
    paths:
      - 'scripts/build-reaction-reference.py'
      - '.github/workflows/reaction-reference.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/build-reaction-reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-reaction-comparison
          path: hozuki-walk/reference-wave-right.png
