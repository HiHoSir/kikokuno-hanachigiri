name: Hizuki Walk Pose Audit
on:
  push:
    paths:
      - 'tools/hizuki_pose_audit.py'
      - 'tests/test_hizuki_pose_audit.py'
      - '.github/workflows/hizuki-walk-audit.yml'
  workflow_dispatch:
jobs:
  pose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check body-local gait semantics
        run: python -m unittest discover -s tests -p test_hizuki_pose_audit.py -v
