<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>新生 鬼哭の花契り 8方向視点検証 v0.7</title><style>*{box-sizing:border-box}body{margin:0;background:#182a24;color:#fff3dc;font:14px system-ui}main{max-width:650px;margin:auto;padding:12px}h1{font-size:19px}p{line-height:1.6;color:#d2dfd1}canvas{display:block;width:100%;height:auto;background:#91b17e;border-radius:12px;touch-action:none}.pad{margin:14px auto;width:180px;height:180px;border-radius:50%;border:3px solid #8a9c87;background:#304e41;touch-action:none;display:grid;place-items:center;font-size:16px;color:#e9e6da;user-select:none}.pad:active{background:#506d52}.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}button,a{padding:10px 12px;border:1px solid #97a99b;border-radius:8px;background:#314c40;color:#fff1d2}a{display:inline-block;text-decoration:none}small{color:#d9dabf}input{max-width:220px;flex:1}</style></head><body><main><h1>2.5D・8方向主人公検証 v0.7</h1><p>新規8方向素材：正面／右前／右／右後／背面／左後／左／左前。丸い方向パッドをなぞると実際に移動し、向きも変わります。</p><canvas id="view" width="600" height="740"></canvas><div class="pad" id="pad">8方向パッド<br>指でなぞる</div><div class="row"><label>歩行速度 <input id="speed" type="range" min="35" max="180" value="100"></label><label>上下動 <input id="bob" type="range" min="0" max="100" value="25"></label></div><div class="row"><button id="reset">位置を戻す</button><a href="./?v=0.6">従来20コマ版へ</a></div><p id="status">素材読み込み中…</p><p><small>素材の方向整合を検証するページです。8方向の静止画像に微小な動きを加えています。8方向の歩行コマ・ボーンアニメや3D柱の遮蔽は未実装で、実ゲーム本編は変更していません。</small></p></main><script>
const cv=document.querySelector('#view'),g=cv.getContext('2d'),atlas=new Image();atlas.src='./hero_8dir.webp?v=0.7';atlas.onload=()=>document.querySelector('#status').textContent='8方向画像を読み込みました。';atlas.onerror=()=>document.querySelector('#status').textContent='画像が未反映です。Pagesデプロイ完了後に再読み込みしてください。';
let x=0,z=0,dir=0,vx=0,vy=0,last=0,distance=0,active=null;const pad=document.querySelector('#pad');
function track(e){const r=pad.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const m=Math.hypot(dx,dy);if(m<.17){vx=vy=0;return}vx=dx/m;vy=dy/m}
pad.onpointerdown=e=>{if(active!==null)return;active=e.pointerId;pad.setPointerCapture(active);track(e)};
pad.onpointermove=e=>{if(e.pointerId===active)track(e)};
for(const name of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(name,e=>{if(e.pointerId===active){active=null;vx=vy=0}});
const keys=new Set();window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.preventDefault();keys.add(e.key.toLowerCase())});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();vx=vy=0});document.querySelector('#reset').onclick=()=>{x=z=distance=0;dir=0};
const names=['正面','右斜め前','右','右斜め後ろ','背面','左斜め後ろ','左','左斜め前'];
function polygon(pts,col){g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}
function frame(t){let dt=Math.min(.05,Math.max(0,(t-last)/1000||0));last=t;
let dx=vx,dy=vy;if(keys.has('arrowright')||keys.has('d'))dx++;if(keys.has('arrowleft')||keys.has('a'))dx--;if(keys.has('arrowdown')||keys.has('s'))dy++;if(keys.has('arrowup')||keys.has('w'))dy--;
const n=Math.hypot(dx,dy),moving=n>.2;if(moving){dx/=n;dy/=n;const speed=1.4*Number(document.querySelector('#speed').value)/100;const nx=Math.max(-4,Math.min(4,x+dx*dt*speed)),nz=Math.max(-4,Math.min(4,z+dy*dt*speed));distance+=Math.hypot(nx-x,nz-z);x=nx;z=nz;dir=(Math.round(Math.atan2(dx,dy)*4/Math.PI)+8)%8}
g.fillStyle='#91b17e';g.fillRect(0,0,600,740);polygon([[0,350],[600,60],[600,365],[0,655]],'#ddc58f');polygon([[0,364],[600,74],[600,89],[0,379]],'#cfb581');g.fillStyle='#9a674b';g.fillRect(412,130,188,234);polygon([[400,134],[525,61],[600,98],[600,167],[430,187]],'#536477');g.fillStyle='#78936b';g.fillRect(0,130,70,180);g.fillStyle='#858c73';g.fillRect(64,235,120,110);g.fillStyle='#436f49';g.beginPath();g.arc(530,570,125,0,7);g.fill();
const px=300+x*45,py=378+z*34;const strength=Number(document.querySelector('#bob').value)/100;const bob=moving?(1-Math.cos(distance*19))*.7*strength:0;
g.fillStyle='rgba(43,49,37,.34)';g.beginPath();g.ellipse(px,py+2,32,10,0,0,7);g.fill();
if(atlas.complete&&atlas.naturalWidth){const sx=(dir%4)*300,sy=Math.floor(dir/4)*420;const h=202,w=202*300/420;g.drawImage(atlas,sx,sy,300,420,px-w/2,py-h-bob,w,h)}
g.fillStyle='rgba(22,41,31,.83)';g.fillRect(15,15,214,56);g.fillStyle='#fff0d7';g.font='bold 20px system-ui';g.fillText(names[dir],26,42);g.font='12px system-ui';g.fillText(moving?'移動中':'待機中',26,61);
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
