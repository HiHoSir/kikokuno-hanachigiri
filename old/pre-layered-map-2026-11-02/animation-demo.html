<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鬼哭の花契り | 少数パーツアニメ検証 v0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#16231e;color:#f7efda;font-family:system-ui,sans-serif}
main{max-width:580px;margin:auto;padding:12px 14px 24px}
h1{font-size:18px;margin:10px 0}p{font-size:12px;color:#c5d5cb;line-height:1.5}
canvas{width:100%;height:auto;aspect-ratio:4/5;background:#81a574;border:2px solid #b6a689;border-radius:8px;display:block;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
button{font:600 14px system-ui;color:#f6efde;background:#263a32;border:1px solid #8a968a;border-radius:9px;min-height:45px;touch-action:manipulation}
button.selected{background:#95703b;border-color:#f3d39e}
label{display:flex;gap:10px;align-items:center;margin:12px 2px;font-size:13px}input{flex:1}
#details{font-size:12px;min-height:38px;color:#c3d1c2}
a{color:#ffda8a}
</style></head><body><main>
<h1>新生 鬼哭の花契り — パーツアニメ検証 v0.1</h1>
<p>主人公の外見は検証用の簡易図。1枚ずつの歩行スプライトを作らず、頭・袖・脚・髪・リボンをコードで動かします。</p>
<canvas id="stage" width="560" height="700" aria-label="動く主人公のアニメーションデモ"></canvas>
<div class="controls" id="modes">
<button data-mode="idle" class="selected">待機</button><button data-mode="walk">歩行</button><button data-mode="talk">会話</button><button data-mode="surprise">驚き</button>
</div>
<label>動きの強さ <input id="amount" type="range" min="0" max="160" value="100"><output id="amountText">100%</output></label>
<label>再生速度 <input id="speed" type="range" min="25" max="200" value="100"><output id="speedText">100%</output></label>
<div id="details"></div>
<p>画面タップでも次の動きへ切り替えられます。実際の正式スプライトではなく、アニメーション手法を評価するためのデモです。<a href="./?v=0.8.1">ゲーム本編へ戻る</a></p>
</main><script type="module" src="./src/animation-demo.js?v=0.1"></script></body></html>
