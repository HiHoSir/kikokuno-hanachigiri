<h1>緋月V8｜形を変えないドット絵仕上げ実験</h1>
<p>右向き歩行8コマ。64×96pxの全透明度・外形・足元・ポーズ・ピボットを維持。色と画素クラスタのみ編集。画像生成・拡大変形なし。</p>
<div class="card controls"><label>比較方式<select id="mode"><option value="B">B：再構成した従来色</option><option value="R1">R1：素材ごとの陰影を整理</option><option value="R3" selected>R3：色面＋孤立画素を整理</option></select></label><label>倍率<select id="scale"><option value="1">1.0倍</option><option value="1.2" selected>1.2倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label><label>速度<select id="speed"><option value="0.5">0.5倍</option><option value="1" selected>1倍（7.7fps）</option><option value="1.5">1.5倍</option></select></label><button id="pause">⏸ 停止</button><button id="step">1コマ進む</button></div>
<div class="card"><canvas id="stage" width="512" height="512"></canvas><p id="status">素材を読み込み中…</p></div>
<div class="card"><h2 style="font-size:15px">現在の8コマ</h2><canvas id="frames" width="512" height="96"></canvas><p class="small">コマをタップするとその位置で停止。色面を変更しても足元・歩行周期は同じです。</p></div>
<div class="card small">この基準Bは、公開済みBのパレットを参照し、同じ3D元画像から再構成した比較用です。公開済みBとのRGB画素完全一致は未確認です。R1・R3はこの再構成Bを元にしています。右向き8コマのみの試作で、本編には未反映です。</div>

const sprites={};let loaded=0,frame=0,last=0,clock=0,playing=true;
for(const [key,src] of Object.entries(data)){const img=new Image();img.onload=()=>{sprites[key]=img;loaded++;if(loaded===3)document.getElementById('status').textContent='表示準備OK・3方式読み込み済み'};img.src=src}
const $=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d'),strip=$('frames'),sx=strip.getContext('2d');
const frameRects=[];
function checker(context,w,h,step){context.fillStyle='#e8eef5';context.fillRect(0,0,w,h);context.fillStyle='#cad7e4';for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step)if((x/step+y/step)%2)context.fillRect(x,y,step,step)}
function draw(t){if(!last)last=t;let dt=Math.min(.08,(t-last)/1000);last=t;if(playing){clock+=dt*7.74*Number($('speed').value);frame=Math.floor(clock)%8}const img=sprites[$('mode').value];checker(ctx,512,512,32);ctx.imageSmoothingEnabled=false;if(img){const z=Number($('scale').value)*4;const w=64*z,h=96*z;const x=256-w/2,y=478-94*z;ctx.drawImage(img,frame*64,0,64,96,Math.round(x),Math.round(y),w,h)}ctx.fillStyle='#162942';ctx.fillRect(8,8,235,30);ctx.fillStyle='#fff';ctx.font='17px system-ui';ctx.fillText($('mode').value+' ｜ 右向き歩行 '+(frame+1)+'/8',17,29);
checker(sx,512,96,8);sx.imageSmoothingEnabled=false;if(img){sx.drawImage(img,0,0);sx.strokeStyle='#f0b45d';sx.lineWidth=2;sx.strokeRect(frame*64+1,1,62,94)}$('status').textContent='右向き歩行 '+(frame+1)+'/8 ｜ 全フレームの形状・透明度は一致';requestAnimationFrame(draw)}
$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'⏸ 停止':'▶ 再生'};
$('step').onclick=()=>{playing=false;$('pause').textContent='▶ 再生';frame=(frame+1)%8;clock=frame};
strip.addEventListener('pointerdown',e=>{let r=strip.getBoundingClientRect();frame=Math.max(0,Math.min(7,Math.floor((e.clientX-r.left)/r.width*8)));clock=frame;playing=false;$('pause').textContent='▶ 再生'});
requestAnimationFrame(draw);
</script></body></html>
