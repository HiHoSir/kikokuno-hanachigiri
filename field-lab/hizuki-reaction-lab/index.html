<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>緋月 原画固定リアクション検証</title><style>body{margin:0;background:#19151f;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;height:100dvh}header{padding:12px;font-weight:bold}.stage{width:min(100%,760px);flex:1;min-height:0;border-radius:12px;background:radial-gradient(#3b3247,#1d1824);position:relative}.stage canvas{width:100%;height:100%;object-fit:contain}#status{position:absolute;top:12px;left:12px;font-size:12px}.panel{max-width:760px;display:grid;gap:8px;padding:10px;box-sizing:border-box}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}button{border:1px solid #70647a;background:#46404e;color:white;padding:9px;border-radius:8px}.sel{background:#b94868}small{opacity:.7;text-align:center}</style></head><body><header>緋月｜原画固定リアクション検証</header><div class="stage"><canvas id="cv" width="640" height="720"></canvas><span id="status">読み込み中</span></div><div class="panel"><div class="buttons" id="dirs"></div><div class="buttons" id="acts"></div><div class="buttons"><button id="save">PNG保存</button><button id="toggle">再生/停止</button></div><small>既存原画を直接表示。関節アニメーションではなく全体変形の試作です。</small></div><script>
const c=document.getElementById('cv'),g=c.getContext('2d'),imgs=Array.from({length:8},(_,i)=>{let im=new Image;im.src='../art/'+i+'.png';return im});let dir=0,act='idle',play=true,start=performance.now();const names=['正面','右斜前','右側','右斜後','背面','左斜後','左側','左斜前'],ops={idle:'待機',surprise:'驚き',joy:'喜び',bow:'おじぎ風',wave:'手振り風'};function buttons(id,items,change){const box=document.getElementById(id);Object.entries(items).forEach(([k,label])=>{let b=document.createElement('button');b.textContent=label;b.dataset.k=k;b.onclick=()=>{change(k);start=performance.now();refresh()};box.append(b)})}function refresh(){[...document.querySelectorAll('#dirs button')].forEach((b,i)=>b.classList.toggle('sel',i===dir));document.querySelectorAll('#acts button').forEach(b=>b.classList.toggle('sel',b.dataset.k===act))}buttons('dirs',names,k=>dir=+k);buttons('acts',ops,k=>act=k);refresh();function draw(t){g.clearRect(0,0,640,720);let im=imgs[dir],ok=im.complete&&im.naturalWidth;document.getElementById('status').textContent=ok?names[dir]+' / '+ops[act]:'画像読み込み待ち';if(ok){let q=play?(t-start)/1000:0,p=(1-Math.cos(q*6))/2,dx=0,dy=0,rot=0,sx=1,sy=1;if(act==='idle')dy=Math.sin(q*2)*2;if(act==='surprise'){dy=-p*14;sx=1+p*.025;sy=1-p*.025}if(act==='joy'){dy=-Math.abs(Math.sin(q*5))*20;rot=Math.sin(q*5)*.025}if(act==='bow'){rot=.1*(1-Math.cos(q*3))/2;dy=7*(1-Math.cos(q*3))/2}if(act==='wave'){rot=Math.sin(q*6)*.06;dx=Math.sin(q*6)*5}let s=Math.min(525/im.height,470/im.width);g.save();g.translate(320+dx,635+dy);g.rotate(rot);g.scale(sx,sy);g.drawImage(im,-im.width*s/2,-im.height*s,im.width*s,im.height*s);g.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);document.getElementById('toggle').onclick=()=>{play=!play;start=performance.now()};document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.download='hizuki_'+dir+'_'+act+'.png';a.href=c.toDataURL('image/png');a.click()};
</script></body></html>
