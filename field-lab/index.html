</head><body><canvas id="game"></canvas><div id="info"><b>新生 鬼哭の花契り — 2.5D技術検証 v0.9.2-lab</b><small><span id="area-name">2.5D検証用の茶屋</span> ／ 正式デザイン候補の比較検証（未承認）<br>移動：スライドD-pad／WASD　会話：A／Enter　出入口：歩いて通過　検証専用セーブ</small></div><div id="area-status" style="position:fixed;top:max(92px,calc(env(safe-area-inset-top) + 92px));left:8px;padding:7px 10px;background:#182927df;border:1px solid #bca579;border-radius:8px;pointer-events:none">現在地：2.5D検証用の茶屋</div><div id="lab" style="position:fixed;right:8px;top:132px;background:#182927eb;padding:8px;border-radius:8px;font-size:12px;max-width:220px"><label>画像 <select id="source"><option value="0">8方向候補（未承認）</option><option value="1">v0.6体型比較 / 4方向絵</option></select></label><br><label><input type="checkbox" id="debug" checked>足元基準点</label><br><button id="start" style="font-size:13px;min-height:32px">茶屋前へ</button> <button id="surprise" style="font-size:13px;min-height:32px">驚き</button><br><a href="audit.html?v=0.9.2" style="color:#ffe09c">素材監査と制限事項</a><p id="telemetry"></p></div><div id="msg"></div><div id="error"></div><div id="controls"><div id="dpad" role="group" aria-label="8方向移動D-pad"><span class="up">▲</span><span class="down">▼</span><span class="left">◀</span><span class="right">▶</span><span class="center"></span></div><button id="talk">A</button></div><script>
(function(){
 const panel=document.querySelector('#error');
 let opaqueError=false;
 function show(message){panel.style.display='block';panel.textContent='起動エラー: '+message;}
 window.addEventListener('error',event=>{
   // Cross-origin CDN errors can be reported as "Script error." without useful details.
   // Do not mistake one of those for a game startup failure when frames are rendering.
   const message=event.message||'';
   if(message==='Script error.'||message==='Script error'){opaqueError=true;return}
   show(message||'リソースの読み込みに失敗しました');
 });
 window.addEventListener('unhandledrejection',event=>show(String(event.reason?.message||event.reason||'モジュールの読み込みに失敗しました')));
 window.addEventListener('load',()=>{setTimeout(()=>{
   const canvas=document.querySelector('#game');
   if(!window.__kikokuRendered){
     if(opaqueError)show('外部スクリプトで詳細不明のエラーが発生しました');
     else if(!canvas||canvas.width===300&&canvas.height===150)show('3D描画の初期化を確認できません');
   }
 },3000)});

})();
</script><script type="module" src="./main.js?v=0.9.2"></script></body></html>
