<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>新生 鬼哭の花契り｜2.5Dモーション検証 v0.5</title><style>*{box-sizing:border-box}body{margin:0;background:#182a24;color:#f9efdc;font-family:system-ui,sans-serif}main{max-width:650px;margin:auto;padding:12px 12px 35px}h1{font-size:17px;margin:6px 0}p{font-size:12px;color:#d1ddce;line-height:1.6;margin:7px 0 12px}.stage{position:relative}canvas{width:100%;aspect-ratio:4/5;display:block;border-radius:9px;border:1px solid #8f937c;background:#89ad7b;touch-action:none}#pad{position:absolute;left:12px;bottom:12px;width:138px;height:138px;touch-action:none;user-select:none;border:1px solid #99b1a9;background:#203b34b0;border-radius:25px}#pad:before,#pad:after{content:'';position:absolute;background:#6d8d82aa;border:1px solid #d5ded6;border-radius:10px}#pad:before{width:45px;height:127px;left:45px;top:5px}#pad:after{height:45px;width:127px;left:5px;top:45px}#pad .mark{position:absolute;z-index:2;color:white;font:bold 18px system-ui;pointer-events:none}#pad .up{left:61px;top:10px}#pad .down{left:60px;bottom:10px}#pad .left{left:12px;top:57px}#pad .right{right:11px;top:57px}#pad .dot{left:58px;top:58px;width:22px;height:22px;border-radius:50%;background:#264038}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0}.buttons button{min-height:45px;border:1px solid #839888;border-radius:8px;background:#2e483b;color:#fcf5e7;font-size:13px}.buttons button.active{background:#986848;border-color:#ffd49d}label{display:flex;align-items:center;gap:10px;font-size:12px;margin:7px 0}input{flex:1}#status{font-size:12px;color:#e7d1a6;margin-top:6px}.tip{font-size:11px;color:#c2cfbd}</style></head><body><main><h1>新生 鬼哭の花契り｜2.5Dモーション検証 v0.3</h1><p>20枚の透過PNG素材を使った操作型デモ。歩行速度と接地影・足元アンカーを改善しました。十字キーを指で滑らせると、主人公が2.5D風フィールドを4方向の絵を使い分けて歩きます。待機・呼吸・会話・驚きも確認できます。</p><div class="stage"><canvas width="600" height="750" id="game"></canvas><div id="pad"><span class="mark up">▲</span><span class="mark down">▼</span><span class="mark left">◀</span><span class="mark right">▶</span><span class="mark dot"></span></div></div><div class="buttons" id="modes"><button data-mode="idle" class="active">待機・呼吸</button><button data-mode="walk">自動歩行</button><button data-mode="talk">会話</button><button data-mode="surprise">驚き</button></div><div class="buttons" id="directions"><button data-dir="0" class="active">正面</button><button data-dir="1">右</button><button data-dir="2">背面</button><button data-dir="3">左</button></div><label>再生速度<input type="range" id="speed" min="40" max="200" value="100"></label><label>演出の強さ<input type="range" id="motion" min="0" max="170" value="100"></label><p id="status">画像を読み込み中...</p><p class="tip">スクリーン上の斜め入力は優勢な方向の絵を選びます。3Dモデルではなく2Dスプライト＋2.5D風背景・接地影による検証です。現在のゲーム本編は変更しません。</p></main><script>
const cv=document.querySelector('#game'),ctx=cv.getContext('2d'),frames=[];let loaded=0;for(let i=0;i<20;i++){let img=new Image();img.onload=()=>{loaded++;if(loaded===20)document.querySelector('#status').textContent='全20フレーム読み込み完了。画面左下のD-padで移動できます。'};img.onerror=()=>document.querySelector('#status').textContent='一部の画像が読み込めません。';img.src='frames/'+String(i).padStart(2,'0')+'.png';frames.push(img)}
let mode='idle',dir=0,x=0,z=2.8,clock=0,old=0,padX=0,padY=0,pid=null,locked=0,walkDistance=0,autoPhase=0;const pad=document.querySelector('#pad');function padMove(e){const b=pad.getBoundingClientRect(),dx=(e.clientX-b.left-b.width/2)/(b.width/2),dy=(e.clientY-b.top-b.height/2)/(b.height/2),angle=Math.atan2(dy,dx);if(Math.hypot(dx,dy)<.17){padX=0;padY=0;return}padX=Math.cos(angle);padY=Math.sin(angle)}pad.onpointerdown=e=>{if(pid!==null)return;pid=e.pointerId;pad.setPointerCapture(pid);padMove(e)};pad.onpointermove=e=>{if(e.pointerId===pid)padMove(e)};function stop(e){if(e.pointerId!==pid)return;pid=null;padX=padY=0}pad.onpointerup=stop;pad.onpointercancel=stop;pad.onlostpointercapture=stop;
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;clock=0;document.querySelectorAll('[data-mode]').forEach(t=>t.classList.toggle('active',t===b))};for(const b of document.querySelectorAll('[data-dir]'))b.onclick=()=>{dir=Number(b.dataset.dir);document.querySelectorAll('[data-dir]').forEach(t=>t.classList.toggle('active',t===b))};let keys=new Set();window.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase())};window.onkeyup=e=>keys.delete(e.key.toLowerCase());window.onblur=()=>{keys.clear();padX=padY=0};
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function scene(){ctx.fillStyle='#90b17e';ctx.fillRect(0,0,600,750);polygon([[0,355],[600,70],[600,390],[0,675]],'#dfc58c');polygon([[0,375],[600,90],[600,104],[0,389]],'#dbc08a');ctx.fillStyle='#824c3f';ctx.fillRect(415,150,185,230);polygon([[398,148],[540,60],[600,90],[600,168],[420,200]],'#455a6b');polygon([[403,372],[600,279],[600,392],[417,480]],'#b88a59');polygon([[0,445],[120,385],[190,422],[70,487]],'#b7af8b');ctx.fillStyle='#4d8659';ctx.beginPath();ctx.arc(70,205,77,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4c6651';ctx.fillRect(60,223,17,66);ctx.fillStyle='#738f6a';ctx.beginPath();ctx.arc(540,610,90,0,7);ctx.fill();ctx.fillStyle='#4a6474';ctx.fillRect(206,555,46,88)}
function render(now){const dt=Math.min(.05,Math.max(0,(now-old)/1000||0));old=now;const sp=Number(document.querySelector('#speed').value)/100,power=Number(document.querySelector('#motion').value)/100;clock+=dt*sp;let dx=padX,dy=padY;if(keys.has('arrowup')||keys.has('w'))dy--;if(keys.has('arrowdown')||keys.has('s'))dy++;if(keys.has('arrowleft')||keys.has('a'))dx--;if(keys.has('arrowright')||keys.has('d'))dx++;const moving=Math.hypot(dx,dy)>.12;const auto=mode==='walk'&&!moving;const activeWalk=moving||auto;
if(moving){const m=Math.hypot(dx,dy);dx/=m;dy/=m;const speed=1.56*dt;const prevX=x,prevZ=z; x=Math.max(-4,Math.min(4,x+dx*speed));z=Math.max(-3.4,Math.min(5,z+dy*speed));walkDistance+=Math.hypot(x-prevX,z-prevZ); if(Math.abs(dx)>Math.abs(dy))dir=dx>0?1:3;else dir=dy>0?0:2}
if(auto)autoPhase+=dt*sp*4.2;const stepPhase=moving?walkDistance*5.4:autoPhase;ctx.clearRect(0,0,600,750);scene();const px=300+x*45,py=385+z*36;const contact=activeWalk?Math.cos(stepPhase*2):1;const bob=activeWalk?(1-contact)*.65*power:Math.sin(clock*2.0)*.35*power;const jump=mode==='surprise'&&!moving?Math.max(0,Math.sin(clock*5))*18*power:0;const shadowStrength=jump>0?Math.max(.15,.36-jump*.008):(.36+Math.max(0,contact)*.04);ctx.fillStyle='rgba(50,58,42,'+shadowStrength.toFixed(3)+')';ctx.beginPath();ctx.ellipse(px,py+3,38-jump*.35,10-jump*.10,0,0,7);ctx.fill();let index=dir*4;if(activeWalk){const step=Math.floor(stepPhase*1.7);index=dir===0?(step%2===0?1:3):dir*4+1+(step%3)} if(mode==='talk'&&!moving)index=16+(Math.floor(clock*2)%2);if(mode==='surprise'&&!moving)index=18+(Math.floor(clock*3)%2);if(dir===0&&!activeWalk&&mode==='idle'&&Math.sin(clock*1.7)>.985)index=2;const img=frames[index];if(img?.complete&&img.naturalWidth){const scale=mode==='surprise'&&!moving?1.00:1.0;const h=200*scale,w=h*img.width/img.height;ctx.save();ctx.translate(px,py-bob-jump);ctx.rotate(activeWalk?Math.sin(stepPhase)*.008*power:mode==='talk'?Math.sin(clock*4)*.025*power:0);ctx.drawImage(img,-w/2,-h,w,h);ctx.restore()}
ctx.fillStyle='#f6eedc';ctx.fillRect(12,12,228,50);ctx.fillStyle='#203729';ctx.font='bold 18px system-ui';ctx.fillText(({idle:'待機／呼吸',walk:'歩行',talk:'会話',surprise:'驚き'})[mode],22,43);ctx.font='12px system-ui';ctx.fillText(['正面','右向き','背面','左向き'][dir]+' / '+String(index).padStart(2,'0')+'.png',22,57);requestAnimationFrame(render)}requestAnimationFrame(render);
</script></body></html>
