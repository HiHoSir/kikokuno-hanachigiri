<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><title>背景レイヤー・衝突・遮蔽検証 v0.2.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182923;color:white;font:13px system-ui,sans-serif}canvas{width:100vw;height:100dvh;display:block;touch-action:none}button{border:1px solid #d9d9c2a0;background:#183732eb;color:#fff;border-radius:10px;padding:7px 9px;font-weight:700;min-height:36px;touch-action:none}button.active{background:#687e47}#top{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:7px;right:7px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;z-index:3;pointer-events:none}#top button{pointer-events:auto}#status{font-size:11px;background:#1a332ee8;border-radius:7px;padding:6px;max-width:100%;pointer-events:none}#pad{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:140px;height:140px;border:1px solid #d0dfbd9a;background:#18382ca8;border-radius:24px;touch-action:none;z-index:3;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;color:#efefd3;font-size:22px;user-select:none}#pad:after{content:'●';grid-area:2/2;color:#9ba989}#pad i{font-style:normal;pointer-events:none}#help{position:fixed;right:9px;bottom:calc(env(safe-area-inset-bottom) + 15px);background:#1a342ddc;border-radius:8px;padding:8px;font-size:11px;max-width:44vw;line-height:1.65}#help strong{color:#f7dea7}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body>
<canvas id="view"></canvas><div id="top"><button id="follow" class="active">追従</button><button id="overview">全体</button><button id="layers" class="active">レイヤー表示</button><button id="hit">判定表示</button><span id="status">主人公を読み込み中</span></div>
<div id="pad"><i style="grid-area:1/2">▲</i><i style="grid-area:2/1">◀</i><i style="grid-area:2/3">▶</i><i style="grid-area:3/2">▼</i></div>
<div id="help"><strong>既存2.5D背景＋単色判定モデル</strong><div>建物・木・柱は仮配置。判定の動作検証用です</div><div>木・柱・屋根の前後を移動</div><div>画面タップ移動 / 十字パッド</div></div>
<script>
(()=>{
'use strict';
const cvs=document.getElementById('view'),ctx=cvs.getContext('2d'),status=document.getElementById('status');
const WORLD={w:960,h:680};let perspectiveImage=null;let W=0,H=0,dpr=1,sc=1,ox=0,oy=0,last=performance.now(),follow=true,showLayers=true,showHit=false,goal=null,joy={x:0,y:0},keys=new Set();
const player={x:370,y:475,dir:1};const rect=(x,y,w,h)=>({type:'rect',x,y,w,h});
const obstacles=[
rect(0,0,960,22),rect(0,658,960,22),rect(0,0,22,680),rect(938,0,22,680),
rect(123,172,196,126),rect(507,132,218,128),
rect(360,235,26,42),rect(768,320,30,39),
rect(423,396,26,28),rect(700,440,26,30)
];
const river=rect(20,540,918,65);
function blocked(x,y,r=11){
  if(x<r||y<r||x>WORLD.w-r||y>WORLD.h-r)return true;
  const blocks=[...obstacles,river];
  return blocks.some(b=>{
    if(b===river && x>307&&x<410)return false;
    const cx=Math.max(b.x,Math.min(x,b.x+b.w)),cy=Math.max(b.y,Math.min(y,b.y+b.h));
    return (x-cx)**2+(y-cy)**2<r*r;
  });
}
const depthObjects=[
 {id:'tree1',x:360,y:235,w:26,h:42,crownX:373,crownY:155,crownW:135,crownH:113,depth:278},
 {id:'tree2',x:768,y:320,w:30,h:39,crownX:782,crownY:238,crownW:142,crownH:116,depth:359},
 {id:'post1',x:423,y:396,w:26,h:28,depth:424},
 {id:'post2',x:700,y:440,w:26,h:30,depth:470},
 {id:'house1',x:123,y:172,w:196,h:126,depth:298},
 {id:'house2',x:507,y:132,w:218,h:128,depth:260}
];
function fill(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function oval(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function worldBase(){
 if(perspectiveImage){ctx.drawImage(perspectiveImage,0,0,960,680);return;}
 fill(0,0,960,680,'#86a67a');fill(28,306,902,62,'#c9b98a');fill(322,70,66,505,'#b5aa7b');
 fill(20,540,918,65,'#669bc0');fill(307,536,103,73,'#dac48d');
 fill(123,172,196,126,'#b87f67');fill(507,132,218,128,'#b87f67');
 ctx.strokeStyle='#e3ddae';ctx.lineWidth=3;ctx.strokeRect(123,172,196,126);ctx.strokeRect(507,132,218,128);
 // Rows are decorative; no input to collision.
 for(let y=45;y<650;y+=58){for(let x=52;x<940;x+=72){ctx.fillStyle='#749b70';ctx.fillRect(x,y,8,15)}}
}
function objectPaint(o){
 if(o.id.startsWith('tree')){fill(o.x,o.y,o.w,o.h,'#826040');oval(o.crownX,o.crownY,o.crownW/2,o.crownH/2,'#42765b');oval(o.crownX-22,o.crownY-12,38,37,'#59956d');}
 else if(o.id.startsWith('post')){fill(o.x-1,o.y-82,o.w+2,o.h+82,'#8e6650');fill(o.x-5,o.y-88,o.w+10,11,'#c6a16e');}
 else{fill(o.x-13,o.y-88,o.w+26,95,'#6f827e');fill(o.x-22,o.y-88,o.w+44,18,'#435e62');}
}
function guide(){
 if(showLayers){ctx.save();ctx.font='bold 14px system-ui';ctx.fillStyle='#24392c';ctx.fillText('遮蔽・深度切替ゾーン',455,335);ctx.fillText('橋は通行可能',410,633);ctx.fillText('建物は通行不可',130,322);ctx.restore()}
 if(showHit){ctx.save();ctx.fillStyle='#ff363645';for(const r of obstacles)ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillRect(river.x,river.y,287,river.h);ctx.fillRect(410,river.y,528,river.h);ctx.strokeStyle='#ef3b3b';ctx.lineWidth=2;for(const o of depthObjects){ctx.strokeRect(o.x,o.y,o.w,o.h)}ctx.restore()}
}
function project(x,y){return{x:x*sc+ox,y:y*sc+oy}}function unproject(x,y){return{x:(x-ox)/sc,y:(y-oy)/sc}}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
const pad=document.getElementById('pad');function padMove(e){const b=pad.getBoundingClientRect(),x=(e.clientX-b.left-b.width/2)/52,y=(e.clientY-b.top-b.height/2)/52,l=Math.hypot(x,y);joy={x:l>1?x/l:x,y:l>1?y/l:y};goal=null}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padMove(e)});for(const t of ['pointercancel','pointerup','lostpointercapture'])pad.addEventListener(t,()=>joy={x:0,y:0});
cvs.addEventListener('pointerdown',e=>{const p=unproject(e.clientX,e.clientY);if(!blocked(p.x,p.y))goal=p});
for(const id of ['follow','overview','layers','hit'])document.getElementById(id).onclick=()=>{if(id==='follow'||id==='overview'){follow=id==='follow';document.getElementById('follow').classList.toggle('active',follow);document.getElementById('overview').classList.toggle('active',!follow)}if(id==='layers'){showLayers=!showLayers;document.getElementById(id).classList.toggle('active',showLayers)}if(id==='hit'){showHit=!showHit;document.getElementById(id).classList.toggle('active',showHit)}};
addEventListener('keydown',e=>{keys.add(e.key);if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key));
function drawHero(now,dt,moving,dx,dy){
 const bridge=window.__hozukiHero;
 if(bridge){bridge.draw(ctx,{x:player.x,y:player.y},1,78*(.89+.18*Math.max(0,Math.min(1,player.y/680))),player.dir,moving,dx,dy,now,dt,'idle',0)}
 else{ /* Never render a substitute for the established protagonist. */ }
}
// Use the actual illustrated 2.5D scene from hozuki-walk, never a top-down replacement.
fetch('../hozuki-walk/index.html?v=0.33.0').then(r=>{if(!r.ok)throw Error('scene '+r.status);return r.text()}).then(html=>{
 const match=html.match(/const IMG='(data:image\/jpeg;base64,[^']+)'/);
 if(!match)throw Error('scene image not found');
 const image=new Image();image.onload=()=>{perspectiveImage=image;};image.src=match[1];
}).catch(err=>{console.warn(err);status.textContent='背景取得失敗: '+err.message});
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 let dx=joy.x,dy=joy.y;
 if(keys.has('ArrowLeft')||keys.has('a'))dx--;if(keys.has('ArrowRight')||keys.has('d'))dx++;
 if(keys.has('ArrowUp')||keys.has('w'))dy--;if(keys.has('ArrowDown')||keys.has('s'))dy++;
 if(Math.hypot(dx,dy)<.06&&goal){const vx=goal.x-player.x,vy=goal.y-player.y,l=Math.hypot(vx,vy);if(l<6)goal=null;else{dx=vx/l;dy=vy/l}}
 const len=Math.hypot(dx,dy);let moving=false;
 if(len>.06){dx/=len;dy/=len;const step=135*dt, nx=player.x+dx*step,ny=player.y+dy*step;
 if(!blocked(nx,ny)){player.x=nx;player.y=ny;moving=true}
 else if(!blocked(nx,player.y)){player.x=nx;moving=true}
 else if(!blocked(player.x,ny)){player.y=ny;moving=true}
 else goal=null;
 player.dir=(Math.round(Math.atan2(dx,dy)*4/Math.PI)+8)%8;
 }
 const fit=Math.min(W/WORLD.w,H/WORLD.h),targetSc=follow?Math.max(fit*1.8,Math.min(W/540,H/540)):fit;sc+=(targetSc-sc)*Math.min(1,dt*7);
 const tx=follow?W*.5-player.x*sc:(W-WORLD.w*sc)/2,ty=follow?H*.48-player.y*sc:(H-WORLD.h*sc)/2;
 ox+=(tx-ox)*Math.min(1,dt*7);oy+=(ty-oy)*Math.min(1,dt*7);
 ctx.fillStyle='#172a25';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);worldBase();
 // Sort tall objects by their physical base, never their image bounding box.
 const render=[...depthObjects.map(o=>({depth:o.depth,draw:()=>objectPaint(o)})),{depth:player.y,draw:()=>drawHero(now,dt,moving,dx*135*dt,dy*135*dt)}];
 render.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());guide();ctx.restore();
 status.textContent='v0.2.2 / '+Math.round(player.x)+','+Math.round(player.y)+' / '+(blocked(player.x,player.y)?'判定エラー':'移動可能')+(window.__hozukiHero?' / 既存アニメ':' / 代替表示');
 requestAnimationFrame(tick)
}requestAnimationFrame(tick);
})();
</script><script type="module">
import {createIllustratedCharacter} from '../hozuki-walk/character-adapter.js?v=0.33.0';
try{window.__hozukiHero=await createIllustratedCharacter()}catch(err){console.error('Existing character could not load',err);document.getElementById('help').textContent='既存の主人公素材の読み込みに失敗しました。代替キャラクターは表示しません。';}
</script></body></html>
