<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>緋月・3D頭身照合 v0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#17272b;color:#f5eee1;font:14px system-ui}main{max-width:850px;margin:auto;padding:12px}h1{font-size:18px}p{line-height:1.5;color:#bed5d4}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{padding:10px;color:#fff;background:#324e58;border:1px solid #9aa;border-radius:7px}button.on{background:#967044}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel{background:#243a42;border-radius:8px;padding:7px}canvas{width:100%;aspect-ratio:362/543;display:block;background:repeating-conic-gradient(#32474e 0 25%,#23343d 0 50%) 50%/20px 20px}label{display:block;margin:8px 0}input{width:100%}small{color:#d4c8aa}a{color:#ffcf85}</style></head><body><main><h1>緋月 3Dプロポーション照合 v0.3</h1><p>左はfield-lab/artの既存原画。右は原画の足元・肩・腰・頭頂を基準に組んだ簡易3Dの人体・衣装ブロックモデルです。これは完成絵ではありません。原画の輪郭と位置関係が一致するまでモデルとしては未承認です。</p><div class="controls" id="dirs"><button class="on" data-dir="0">正面</button><button data-dir="2">右向き</button><button data-dir="4">背面</button><button data-dir="6">左向き</button></div><div class="grid"><div class="panel"><small>原画（変更なし）</small><canvas id="reference" width="362" height="543"></canvas></div><div class="panel"><small>3D構造モデル（未承認）</small><canvas id="model" width="362" height="543"></canvas></div></div><label>頭部の横幅 <input id="headWidth" type="range" min="65" max="150" value="116"></label><label>頭部の縦幅 <input id="headHeight" type="range" min="90" max="180" value="113"></label><label>肩幅 <input id="shoulderWidth" type="range" min="45" max="160" value="66"></label><label>全体の前後厚み <input id="depth" type="range" min="40" max="140" value="80"></label><label><input type="checkbox" id="overlay" checked style="width:auto"> 右のモデルに原画の輪郭を重ねる</label><label>原画の重ね合わせ濃度 <input type="range" id="opacity" min="0" max="100" value="35"></label><div id="status">読み込み中…</div><p>共通アンカー：緑=足元、黄=肩、青=腰。輪郭・頭部比・足元のズレを目視確認するための実験です。<a href="./proportion-calibration.html">原画校正に戻る</a></p></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const ref=document.querySelector('#reference'),rc=ref.getContext('2d'),canvas=document.querySelector('#model');
const overlayCanvas=document.createElement('canvas');overlayCanvas.width=362;overlayCanvas.height=543;overlayCanvas.style.cssText='position:absolute;inset:0;pointer-events:none;width:100%;height:100%';const holder=document.createElement('div');holder.style.cssText='position:relative;width:100%;aspect-ratio:362/543';canvas.parentNode.insertBefore(holder,canvas);holder.append(canvas,overlayCanvas);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(1);renderer.setSize(362,543,false);renderer.setClearColor(0,0);
const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(-181,181,271.5,-271.5,.1,1000);camera.position.set(0,0,650);camera.lookAt(0,0,0);
const mat=(color)=>new THREE.MeshBasicMaterial({color,transparent:true,opacity:.88,depthWrite:true});
const purple=mat('#35253b'),red=mat('#cf172b'),white=mat('#f2e8da'),skin=mat('#f4c4a0'),gold=mat('#e9bd6d'),brown=mat('#654936');
let dir=0,modelParts=[];
function ellipsoid(parent,m,x,y,z,rx,ry,rz){const obj=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),m);obj.position.set(x,y,z);obj.scale.set(rx,ry,rz);parent.add(obj);return obj}
function cone(parent,m,x,y,z,r,h){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,16),m);o.position.set(x,y,z);parent.add(o);return o}
const rig=new THREE.Group();scene.add(rig);
function make(){
 while(rig.children.length){const o=rig.children[0];rig.remove(o);o.traverse(n=>{if(n.geometry)n.geometry.dispose()})}
 const headw=+document.querySelector('#headWidth').value,headh=+document.querySelector('#headHeight').value,shoulder=+document.querySelector('#shoulderWidth').value,depth=+document.querySelector('#depth').value;
 // World-space coordinates are source-pixel distances from the planted sole.
 const f=frames[dir],foot=f.footY,shoulderY=[282,285,291,291,260,263,263,264][dir],hipY=[410,417,411,418,384,384,383,386][dir];
 const toY=y=>foot-y;
 ellipsoid(rig,red,0,toY(hipY)-10,0,shoulder*.80,61,depth*.68);
 ellipsoid(rig,white,0,toY((shoulderY+hipY)/2),0,shoulder,72,depth*.55);
 ellipsoid(rig,skin,0,toY(shoulderY)-10,0,shoulder*.27,32,depth*.36);
 for(const sign of [-1,1]){
  ellipsoid(rig,white,sign*(shoulder+19),toY(shoulderY+62),0,31,76,24);
  ellipsoid(rig,skin,sign*32,toY(hipY+56),0,23,54,23);
  ellipsoid(rig,red,sign*34,26,14,33,25,38);
 }
 // The sprite head sits ABOVE shoulders. Previous prototype placed its center too high.
 const top=f.bbox[1],headCenter=(top+shoulderY-15)/2;
 const headY=toY(headCenter);
 ellipsoid(rig,purple,0,headY,-4,headw,Math.min(headh,(shoulderY-top)/2),depth);
 ellipsoid(rig,skin,0,headY-18,depth*.65,headw*.73,headh*.61,depth*.45);
 ellipsoid(rig,red,-headw*.6,headY+Math.min(headh,(shoulderY-top)/2)*.75,0,headw*.48,25,23);
 ellipsoid(rig,red,headw*.6,headY+headh*.75,0,headw*.48,25,23);
 cone(rig,gold,0,headY+headh*.67,depth*.78,17,66);
}
let frames=[],images=[];
async function init(){
 const r=await fetch('../field-lab/art/manifest.json?v=0.1');const meta=await r.json();frames=meta.frames;images=await Promise.all(frames.map((f)=>new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src='../field-lab/art/'+f.file+'?v=0.1'})));
 update();document.querySelector('#status').textContent='原画を基準に頭頂・肩・腰・足元を照合。モデルは未承認。';
}
function update(){
 if(!frames.length)return;
 const f=frames[dir],img=images[dir];rc.clearRect(0,0,362,543);if(img)rc.drawImage(img,0,0);
 make();
 // All projections share the original reference foot anchor, without arbitrary world-height rescaling.
 rig.position.set(f.footX-181,271.5-f.footY,0);
 rig.rotation.y=dir*Math.PI/4;
 renderer.render(scene,camera);
 if(document.querySelector('#overlay').checked && img){
  // A comparison layer only; the 3D mesh and original textures remain separate.
  // Render comparison on a separate transparent canvas over WebGL.
  overlayCanvas.getContext('2d').clearRect(0,0,362,543);
  const ox=overlayCanvas.getContext('2d');ox.globalAlpha=+document.querySelector('#opacity').value/100;ox.drawImage(img,0,0);ox.globalAlpha=1;
 }else overlayCanvas.getContext('2d').clearRect(0,0,362,543);
 const guide=(ctx)=>{for(const [y,color] of [[f.footY,'#62da86'],[[282,285,291,291,260,263,263,264][dir],'#fbd36c']]){ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(362,y+.5);ctx.stroke()}};
 guide(rc);
}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=+b.dataset.dir;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('on',x===b));update()});
document.querySelectorAll('input').forEach(x=>{x.oninput=update;x.onchange=update});
init().catch(e=>document.querySelector('#status').textContent='読み込み失敗：'+e);
</script></body></html>
