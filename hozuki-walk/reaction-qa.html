<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>緋月・リアクション原画比較 QA v0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#1a2229;color:#f3e8dd;font:14px system-ui,sans-serif;padding:16px}header{position:sticky;top:0;background:#1a2229e9;z-index:2;padding:10px 0;border-bottom:1px solid #788}h1{font-size:18px;margin:0 0 8px}.muted{color:#b8c9cb}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{color:inherit;background:#304655;border:1px solid #789;border-radius:7px;padding:8px}button:focus{outline:3px solid #efba6c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px;margin-top:16px}.card{background:#22343c;border:1px solid #50636a;border-radius:10px;padding:10px}h2{font-size:14px;margin:0 0 8px}.pair{display:flex;gap:5px}.panel{flex:1;min-width:0}.checker{background-color:#65727b;background-image:linear-gradient(45deg,#889299 25%,transparent 25%,transparent 75%,#889299 75%),linear-gradient(45deg,#889299 25%,transparent 25%,transparent 75%,#889299 75%);background-position:0 0,10px 10px;background-size:20px 20px;height:255px;display:flex;justify-content:center;align-items:center;overflow:hidden}.checker img{object-fit:contain;height:220px;max-width:100%;image-rendering:auto}.checker img.big{height:440px}.status{font-weight:bold;min-height:24px}.fail{color:#ffb0a8}.pass{color:#a5efc7}.details{font-size:12px;margin-top:4px}.scene{border:1px solid #718;min-height:20px}
</style></head><body><header><h1>緋月：既存キャラ原画と方向別リアクションの比較検査</h1><div class="muted">原画を絶対基準にする。画像の自動合格はデザイン承認を意味しません。</div><div class="bar"><label>動作 <select id="act"><option value="surprise">驚き</option><option value="wave">手振り</option><option value="bow">おじぎ</option><option value="cheer">喜ぶ</option></select></label><label>倍率 <select id="zoom"><option value="1">1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label><button id="rerun">再検査</button><span id="summary"></span></div></header><main class="grid" id="cards"></main><script>
const dirs=['front','front_right','right','back_right','back','back_left','left','front_left'];const labels=['正面','右斜前','右','右斜後','背面','左斜後','左','左斜前'];const root='../field-lab/art/';
const $=id=>document.getElementById(id);
function load(url){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=url+(url.includes('?')?'&':'?')+'qa=0.1'})}
async function render(){
 const name=$('act').value,z=+$('zoom').value;
 $('cards').innerHTML='';$('summary').textContent='原画と候補を確認中…';
 let meta;try{meta=await(await fetch(root+'manifest.json?qa=0.1')).json()}catch{$('summary').textContent='原画のmanifestが読めません';return}
 let failures=0;let loaded=0;
 for(let d=0;d<8;d++){
  const ref=meta.frames[d];const [base,pose]=await Promise.all([load(root+ref.file),load(root+'directional-actions/'+name+'__'+dirs[d]+'.png')]);
  const card=document.createElement('section');card.className='card';
  const status=pose?'候補あり：原画との頭身・衣装・顔・足元を要目視照合':'不合格：方向別の専用画像が未登録';
  if(pose)loaded++;else failures++;
  card.innerHTML='<h2>'+labels[d]+'</h2><div class="pair"><div class="panel"><strong>既存原画</strong><div class="checker"><img class="base"></div></div><div class="panel"><strong>候補画像</strong><div class="checker"><img class="pose"></div></div></div><div class="status '+(pose?'':'fail')+'">'+status+'</div><div class="details">原寸 '+ref.width+'×'+ref.height+' / 足元アンカー '+ref.footX+','+ref.footY+'</div>';
  const set=(className,img)=>{const el=card.querySelector(className);if(img){el.src=img.src;el.style.height=(220*z)+'px';el.parentElement.style.height=(255*z)+'px'}else el.style.display='none'};
  set('.base',base);set('.pose',pose);
  $('cards').append(card)
 }
 $('summary').textContent='候補登録：'+loaded+'/8方向 ／ 欠落：'+failures+' ／ デザイン承認：未完了';
}
$('act').onchange=render;$('zoom').onchange=render;$('rerun').onclick=render;render();
</script></body></html>
