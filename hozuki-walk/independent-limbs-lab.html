<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>緋月 | 独立四肢歩行ラボ</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#121824;color:#ecf4fd;padding:12px 12px 50px}
main{max-width:700px;margin:auto}h1{font-size:20px;margin:8px 0}p{line-height:1.6;color:#c5d5e5;font-size:13px}
.panel{background:#202a39;border:1px solid #445263;border-radius:14px;padding:12px;margin-top:10px}
canvas{display:block;width:100%;max-width:430px;height:auto;margin:0 auto;background:radial-gradient(ellipse at 50% 65%,#385269 0,#1e2d3f 60%,#152132 100%);border-radius:10px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}button{border:1px solid #67819a;border-radius:9px;padding:10px 15px;background:#30465d;color:white;font-weight:700}
button.on{background:#447c74;border-color:#7acdbc}label{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px}input[type=range]{flex:1;min-width:80px}
small{color:#b5c9dd}strong{color:#ffe0a6}.status{font-size:13px;padding:7px;color:#bddadc}
</style></head><body><main>
<h1>緋月・独立四肢歩行ラボ v0.1</h1>
<p>既存の8方向原画のうち<strong>右向き静止画</strong>を読み込み、元絵を保持したまま部分マスクと関節回転で歩行を試験します。原画の見えない腕・脚は暫定複製のため、完成素材ではありません。</p>
<div class="panel"><canvas id="view" width="430" height="600" aria-label="歩行プレビュー"></canvas>
<div class="status" id="status">原画を読み込み中…</div>
<div class="buttons"><button id="toggle" class="on">一時停止</button><button id="step">一歩ずつ</button><button id="reset">初期化</button></div>
<label>歩幅 <input id="stride" type="range" min="0" max="90" value="42"><output id="strideOut">42</output></label>
<label>腕振り <input id="arm" type="range" min="0" max="60" value="20"><output id="armOut">20</output></label>
<label>速度 <input id="speed" type="range" min="30" max="180" value="90"><output id="speedOut">90</output></label>
<label><input id="overlay" type="checkbox">元画像を重ねて比較</label>
<label><input id="guides" type="checkbox" checked>関節・レイヤーを表示</label>
</div><p>足は <strong>接地60%／遊脚40%</strong> の周期を使用。手前の脚が前進するとき奥側の腕が前へ出る交差運動と、重なり順の切替を検査します。横向き原画の1本しか見えない腕・脚は暫定的にコピーしているため、顔や衣装を生成・変更しません。</p>
<p id="phase"></p>
</main><script type="module">
import {footCycle, STRIDE} from '../field-lab/rig.js?v=0.12.1';
const cv=document.getElementById('view'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const S={playing:true,phase:0,last:0,frames:0,img:null,parts:{},status:'loading'};
const W=362,H=543,baseX=34,baseY=14,scale=1;
const image=new Image();image.crossOrigin='anonymous';
image.onload=()=>{S.img=image;makeParts();$('status').textContent='既存の右向き原画を読み込みました（候補素材・未承認）。';S.status='ready'};
image.onerror=()=>{$('status').textContent='画像を読み込めませんでした。GitHub Pages上で再読み込みしてください。';S.status='error'};
image.src='../field-lab/art/2.png?v=0.12.1';
function makeMask(path){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(image,0,0,W,H);g.globalCompositeOperation='destination-in';g.fillStyle='#fff';g.beginPath();path(g);g.fill();return c}
function poly(points){return g=>{g.moveTo(...points[0]);for(const p of points.slice(1))g.lineTo(...p);g.closePath()}}
function makeParts(){
 // Side-facing source landmarks. Exact masks remain experimental.
 const leg=poly([[216,404],[267,402],[264,429],[256,461],[276,492],[294,524],[191,524],[211,490],[212,459]]);
 const arm=poly([[209,281],[256,279],[276,318],[293,365],[285,396],[249,391],[233,349],[217,320]]);
 const full=document.createElement('canvas');full.width=W;full.height=H;
 const g=full.getContext('2d');g.drawImage(image,0,0,W,H);
 for(const shape of [leg,arm]){g.save();g.globalCompositeOperation='destination-out';g.beginPath();shape(g);g.fill();g.restore()}
 S.parts={torso:full,nearLeg:makeMask(leg),farLeg:makeMask(leg),nearArm:makeMask(arm),farArm:makeMask(arm)};
}
function drawPart(img,ax,ay,angle,offsetX=0,offsetY=0,alpha=1){ctx.save();ctx.translate(ax+offsetX,ay+offsetY);ctx.rotate(angle);ctx.globalAlpha=alpha;ctx.drawImage(img,-ax,-ay);ctx.restore()}
function draw(){
 ctx.clearRect(0,0,430,600);
 ctx.save();ctx.translate(baseX,baseY);
 if(S.img){
  const p=S.phase,amp=Number($('stride').value)/90,armAmp=Number($('arm').value)/60;
  const front=footCycle(p),back=footCycle(p+Math.PI),contact=Math.cos(p*2);
  const bob=(1-contact)*1.1*amp;
  const legMotion=(s)=>({dx:s.along/STRIDE*49*amp,dy:-s.lift*140*amp,angle:(s.along/STRIDE)*.55*amp});
  const n=legMotion(front),f=legMotion(back);
  const na=Math.sin(p+Math.PI)*.55*armAmp,fa=Math.sin(p)*.55*armAmp;
  ctx.save();ctx.translate(0,bob);
  // Order is fixed by physical near/far designation, not by phase.
  // Rear leg and arm behind the body; near limbs above it.
  drawPart(S.parts.farLeg,233,412,f.angle,f.dx-7,f.dy-2,.87);
  drawPart(S.parts.farArm,226,291,fa,-12,-1,.83);
  ctx.drawImage(S.parts.torso,0,0);
  drawPart(S.parts.nearLeg,233,412,n.angle,n.dx,n.dy,1);
  drawPart(S.parts.nearArm,226,291,na,0,0,1);
  ctx.restore();
  if($('overlay').checked){ctx.globalAlpha=.35;ctx.drawImage(S.img,0,0);ctx.globalAlpha=1}
  if($('guides').checked){
    for(const [x,y,c,t] of [[233+n.dx,412+n.dy,'#ffbd75','手前脚'],[226,291,'#ffbd75','手前腕'],[226-12,291,'#91cfff','奥腕'],[233+f.dx-7,412+f.dy-2,'#91cfff','奥脚']]){
      ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#1b2535';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=c;ctx.font='12px sans-serif';ctx.fillText(t,x+8,y-7);
    }
  }
  ctx.restore();
  const pct=Math.round(((p/(2*Math.PI))%1)*100);
  $('phase').textContent='歩行位相 '+pct+'% / 手前脚 '+(front.stance?'接地':'遊脚')+' / 奥脚 '+(back.stance?'接地':'遊脚');
 }else{ctx.fillStyle='#e3efff';ctx.textAlign='center';ctx.font='16px sans-serif';ctx.fillText(S.status==='error'?'画像の読み込みに失敗':'読み込み中…',215,280);ctx.textAlign='left';ctx.restore()}
}
function loop(t){if(S.last&&S.playing)S.phase+=Math.min((t-S.last)/1000,.05)*Math.PI*2*(Number($('speed').value)/90);S.last=t;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
$('toggle').onclick=()=>{S.playing=!S.playing;$('toggle').textContent=S.playing?'一時停止':'再生';$('toggle').classList.toggle('on',S.playing)};
$('step').onclick=()=>{S.playing=false;$('toggle').textContent='再生';$('toggle').classList.remove('on');S.phase+=Math.PI/4};
$('reset').onclick=()=>{S.phase=0;S.playing=true;$('toggle').textContent='一時停止';$('toggle').classList.add('on')};
for(const id of ['stride','arm','speed'])$(id).oninput=()=>$(id+'Out').textContent=$(id).value;
</script></body></html>
