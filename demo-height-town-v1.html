function progress(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];return clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy),0,1)}
function atHeight(p){const id=idAtPixel(p[0],p[1]);if(id===2)return 0;if(id===1)return 1.25;if(id===3)return 3;
if(id===4)return 1.25*progress(p,[568,1012],[586,943]);if(id===5)return 1.25+1.75*progress(p,[817,509],[939,350]);return null}
function linked(a,b,p,q){if(a===b)return a!==0;if(!a||!b)return false;const s=[a,b].sort((x,y)=>x-y).join('-');const stairPos=(code)=>a===code?p:q;
if(s==='2-4')return progress(stairPos(4),[568,1012],[586,943])<=.30;
if(s==='1-4')return progress(stairPos(4),[568,1012],[586,943])>=.67;
if(s==='1-5')return progress(stairPos(5),[817,509],[939,350])<=.25;
if(s==='3-5')return progress(stairPos(5),[817,509],[939,350])>=.70;

function nodeNear(p,maxCells=12){let ix=Math.floor(p[0]/STEP),iy=Math.floor(p[1]/STEP),best=-1,bestDist=Infinity;
for(let dy=-maxCells;dy<=maxCells;dy++)for(let dx=-maxCells;dx<=maxCells;dx++){
let x=ix+dx,y=iy+dy;if(x<0||y<0||x>=C||y>=R)continue;const n=y*C+x;if(!tiles[n])continue;const q=pxOf(x,y),d=(p[0]-q[0])**2+(p[1]-q[1])**2;

if(dx&&dy){const qx=pxOf(nx,y),qy=pxOf(x,ny),bx=tiles[y*C+nx],by=tiles[ny*C+x];if(!bx||!by||!linked(a,bx,p,qx)||!linked(a,by,p,qy))continue}

}
if(!Number.isFinite(dist[goal]))return null;const ret=[];let n=goal;while(n!==-1){ret.push(pxOf(n%C,Math.floor(n/C)));n=parent[n]}return ret.reverse()}

function polygonPath(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()}
let navOverlay=null;
function getNavOverlay(){if(navOverlay)return navOverlay;const o=document.createElement('canvas');o.width=ROOT_W;o.height=ROOT_H;const cx=o.getContext('2d');for(let j=0;j<R;j++)for(let i=0;i<C;i++){const code=tiles[j*C+i];if(!code)continue;cx.fillStyle=colors[code];cx.fillRect(i*STEP,j*STEP,STEP,STEP)}navOverlay=o;return o}
function actor(){ctx.save();ctx.translate(state.x,state.y);ctx.fillStyle='rgba(20,30,23,.36)';ctx.beginPath();ctx.ellipse(0,-2,15,5,0,0,Math.PI*2);ctx.fill();
if(heroImg.complete&&heroImg.naturalWidth===80&&heroImg.naturalHeight===112){const s=.85;ctx.drawImage(heroImg,-43.6993*s,-97.5213*s,80*s,112*s)}else{
ctx.fillStyle='#5cc3e0';ctx.strokeStyle='#122d4c';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-20,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#cc3852';ctx.fillRect(-8,-10,16,14);ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('検',0,-34)}ctx.restore()}
function roofOcclusion(){if(!state.occlusion)return;const actorY=state.y;
for(const b of MAP.buildings){const p=b.roof_polygon_px,ys=p.map(e=>e[1]);const xs=p.map(e=>e[0]);const targetHeight=b.level==='shrine'?3:1.25;
const h=atHeight([state.x,state.y]);if(h===null||Math.abs(h-targetHeight)>.60)continue;
if(state.x<Math.min(...xs)-25||state.x>Math.max(...xs)+25)continue;
const front=Math.max(...b.collision_polygon_px.map(e=>e[1]));
// Approximate screen-space foreground masking; no hidden 3D visibility proof.
if(actorY>=front+28)continue;
ctx.save();polygonPath(p);ctx.clip();ctx.drawImage(bg,0,0);ctx.restore();}}
function render(){if(!bg.complete||!bg.naturalWidth)return;const [w,h,dpr]=viewportSize();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const [camX,camY,sc]=displayTransform(w,h);ctx.translate(w/2,h/2);ctx.scale(sc,sc);ctx.translate(-camX,-camY);
ctx.drawImage(bg,0,0);
if(state.showZones)ctx.drawImage(getNavOverlay(),0,0);
if(state.showColliders){for(const b of MAP.buildings){ctx.save();ctx.fillStyle='rgba(224,78,72,.24)';ctx.strokeStyle='rgba(255,113,91,.93)';ctx.lineWidth=3;polygonPath(b.collision_polygon_px);ctx.fill();ctx.stroke();ctx.restore()}}
if(state.route.length){ctx.strokeStyle='rgba(38,131,238,.92)';ctx.lineWidth=5;ctx.setLineDash([9,8]);ctx.beginPath();ctx.moveTo(state.x,state.y);for(const p of state.route)ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.setLineDash([])}
actor();roofOcclusion();
if(state.showZones){ctx.font='bold 19px sans-serif';ctx.lineWidth=4;ctx.textAlign='center';for(const [p,t] of [[[572,1026],'H0'],[[819,715],'H1'],[[1076,314],'H2']]){ctx.strokeStyle='rgba(22,25,23,.8)';ctx.fillStyle='#fff';ctx.strokeText(t,...p);ctx.fillText(t,...p)}}
const code=idAtPixel(state.x,state.y),height=atHeight([state.x,state.y]);readout.textContent=`${labels[code]||'未定義'} ｜ 高さ H=${height===null?'?':height.toFixed(2)} ｜ 足元 ${Math.round(state.x)},${Math.round(state.y)} ｜ ${state.route.length?'移動中':'停止中'}${heroImg.complete&&heroImg.naturalWidth?' ｜ V35':' ｜ 検査マーカー'}`;
}
function clientToImage(clientX,clientY){const r=canvas.getBoundingClientRect(),p=[clientX-r.left,clientY-r.top];return [(p[0]-r.width/2)/viewScale+viewX,(p[1]-r.height/2)/viewScale+viewY]}
let pointer=null;
canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,camX:state.cameraX,camY:state.cameraY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.hypot(dx,dy)>9)pointer.moved=true;if(pointer.moved){state.follow=false;document.querySelector('#follow').setAttribute('aria-pressed','false');state.cameraX=pointer.camX-dx/viewScale;state.cameraY=pointer.camY-dy/viewScale}});
canvas.addEventListener('pointerup',e=>{if(pointer&&pointer.id===e.pointerId&&!pointer.moved)go(clientToImage(e.clientX,e.clientY));pointer=null});
canvas.addEventListener('pointercancel',()=>pointer=null);
function buttonToggle(id,key){const b=document.getElementById(id);b.onclick=()=>{state[key]=!state[key];b.setAttribute('aria-pressed',String(state[key]));render()}}
buttonToggle('zones','showZones');buttonToggle('colliders','showColliders');buttonToggle('occlusion','occlusion');buttonToggle('follow','follow');
for(const [id,p] of [['lowBtn',[573,1015]],['villageBtn',[807,699]],['shrineBtn',[1026,327]]]){document.getElementById(id).onclick=()=>{state.follow=true;document.querySelector('#follow').setAttribute('aria-pressed','true');state.zoom=Math.max(1.7,state.zoom);go(p)}}
document.getElementById('zoomIn').onclick=()=>{state.zoom=Math.min(4,state.zoom*1.35);render()};document.getElementById('zoomOut').onclick=()=>{state.zoom=Math.max(1,state.zoom/1.35);render()};
function keyName(e){const k=e.key.toLowerCase();return ({arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'})[k]}
window.addEventListener('keydown',e=>{const k=keyName(e);if(k){e.preventDefault();state.keys.add(k)}});window.addEventListener('keyup',e=>{const k=keyName(e);if(k){e.preventDefault();state.keys.delete(k)}});
window.addEventListener('blur',()=>state.keys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden)state.keys.clear()});
for(const b of document.querySelectorAll('#pad button')){const k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();state.keys.add(k);b.setPointerCapture(e.pointerId)});for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>state.keys.delete(k))}
window.__mapProbe={state,tiles,findRoute,go,nodeNear,atHeight,labels};
bg.onload=()=>{render();requestAnimationFrame(tick)};if(bg.complete&&bg.naturalWidth){render();requestAnimationFrame(tick)};
</script></body></html>
