<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192b23"><title>新生 鬼哭の花契り — 主人公モーション検証</title>
<style>*{box-sizing:border-box}body{margin:0;background:#192b23;color:#fff0da;font:14px system-ui,sans-serif}main{max-width:600px;margin:auto;padding:15px}h1{font-size:18px;margin:8px 0}p{font-size:13px;line-height:1.55;color:#ccddca}canvas{width:100%;aspect-ratio:4/5;display:block;border:1px solid #7d8c73;border-radius:10px;background:#a6bd92}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}button{background:#344b3d;color:white;border:1px solid #7d967c;border-radius:8px;min-height:46px;font-size:13px;touch-action:manipulation}button.on{background:#976444;border-color:#ffd69a}label{display:flex;gap:12px;margin:12px 0;align-items:center}input{flex:1}small{color:#d4dbc8}a{color:#ffd38f}#status{margin:8px 0;color:#edcb97}</style></head><body><main>
<h1>新生 鬼哭の花契り — 主人公アニメ検証 v0.1</h1><p>主人公デザインの実画像を使用。呼吸・歩行・会話・驚きの動きをプログラム側で補完します。ゲーム本編は変更していません。</p>
<canvas id="scene" width="480" height="600"></canvas>
<div class="buttons" id="actions"><button data-act="idle" class="on">呼吸・待機</button><button data-act="walk">歩行</button><button data-act="talk">会話</button><button data-act="surprise">驚き</button></div>
<div class="buttons" id="directions"><button data-dir="0" class="on">正面</button><button data-dir="1">右向き</button><button data-dir="2">背面</button><button data-dir="3">左向き</button></div>
<label>動きの強さ <input id="power" type="range" min="0" max="200" value="100"></label>
<label>再生速度 <input id="speed" type="range" min="25" max="200" value="100"></label>
<div class="buttons"><button id="pause">一時停止</button><button id="reset">リセット</button></div><div id="status">画像を読み込み中...</div>
<p><small>注意：軽量プレビュー用に4方向画像を縮小しています。正面・左右・背面は実画像ですが、脚の交互動作や頭・袖の厳密な関節制御は未実装です。呼吸・会話・驚きは画像の揺れと姿勢変化で表現しています。</small></p>
<p><a href="../">ゲーム本編に戻る</a></p>
</main><script>
const canvas=document.querySelector('#scene'),g=canvas.getContext('2d'),img=new Image();img.src='./hero-atlas.avif?v=1';
let dir=0,action='idle',time=0,prev=0,paused=false,start=0;
img.onload=()=>document.querySelector('#status').textContent='画像読み込み完了（4方向／軽量プレビュー）';
img.onerror=()=>document.querySelector('#status').textContent='画像の読み込みに失敗しました。デプロイ完了後、ページを再読み込みしてください。';
function selected(group,attr,value){document.querySelectorAll('#'+group+' button').forEach(b=>b.classList.toggle('on',b.dataset[attr]===String(value)))}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=Number(b.dataset.dir);selected('directions','dir',dir)});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{action=b.dataset.act;start=time;selected('actions','act',action)});
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生する':'一時停止'};
document.querySelector('#reset').onclick=()=>{action='idle';dir=0;time=0;start=0;selected('actions','act',action);selected('directions','dir',dir)};
function render(now){let dt=Math.min((now-prev)/1000||0,.05);prev=now;if(!paused)time+=dt*(Number(document.querySelector('#speed').value)/100);
const a=Number(document.querySelector('#power').value)/100,t=time*7.8,walk=action==='walk',talk=action==='talk',surprise=action==='surprise';
g.clearRect(0,0,480,600);g.fillStyle='#a2b98e';g.fillRect(0,0,480,600);g.fillStyle='#d2b688';g.beginPath();g.moveTo(0,340);g.lineTo(480,300);g.lineTo(480,600);g.lineTo(0,600);g.fill();g.fillStyle='#9c6e49';g.fillRect(375,65,22,370);g.fillStyle='#be9262';g.fillRect(335,430,145,20);g.fillStyle='#678d61';g.fillRect(0,120,70,200);
const cycle=((time-start)%1.9+1.9)%1.9;
const leap=surprise&&cycle<.6?Math.sin(cycle/.6*Math.PI)*27*a:0;
const bob=walk?Math.abs(Math.sin(t))*7*a:Math.sin(time*2.2)*2*a;
const sway=walk?Math.sin(t)*.027*a:talk?Math.sin(time*3)*.04*a:surprise?-.075*a:Math.sin(time*1.4)*.012*a;
g.fillStyle='rgba(53,53,40,.25)';g.beginPath();g.ellipse(240,494,76-leap*.8,16,0,0,Math.PI*2);g.fill();
if(img.complete&&img.naturalWidth){const w=240,h=420;g.save();g.translate(240,480-bob-leap);g.rotate(sway);const torso=1+Math.sin(time*2)*.008*a;const x=-w/2,y=-h;
g.drawImage(img,dir*64,0,64,112,x,y,w,h);
if(!walk&&!surprise){g.save();g.globalAlpha=.12;g.translate(Math.sin(time*2.1)*2*a,0);g.drawImage(img,dir*64,0,64,78,x,y,w,h*.7);g.restore()}
g.restore()}
g.fillStyle='#25382e';g.font='bold 19px system-ui';g.fillText({idle:'待機／呼吸',walk:'歩行（重心移動）',talk:'会話（身振り）',surprise:'驚き'}[action],16,35);
requestAnimationFrame(render)}requestAnimationFrame(render);
</script></body></html>
